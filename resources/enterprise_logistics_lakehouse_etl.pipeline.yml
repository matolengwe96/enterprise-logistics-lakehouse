# The main pipeline for enterprise_logistics_lakehouse

resources:
  pipelines:
    enterprise_logistics_lakehouse_etl:
      name: enterprise_logistics_lakehouse_etl
      catalog: logistics_prod
      schema: raw_landing
      serverless: true
      root_path: "../src/enterprise_logistics_lakehouse_etl"

      libraries:
        - glob:
            include: ../src/enterprise_logistics_lakehouse_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}