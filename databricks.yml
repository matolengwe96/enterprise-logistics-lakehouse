# This is a Declarative Automation Bundle definition for enterprise_logistics_lakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: enterprise_logistics_lakehouse
  uuid: 506db3e5-ec82-4441-9618-f70675565132

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ad739ccf-d2cb.cloud.databricks.com?w=7474644255324691
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-ad739ccf-d2cb.cloud.databricks.com?w=7474644255324691
      # We explicitly deploy to /Workspace/Users/matolematics07@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/matolematics07@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: matolematics07@gmail.com
        level: CAN_MANAGE
